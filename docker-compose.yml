version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: bookreview-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookreview-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookreview-app
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SECRET_DB_PASSWORD: ${SECRET_DB_PASSWORD}
      SECRET_JWTSECRET: ${SECRET_JWTSECRET}
      SECRET_JWTEXPIRATIONINMS: ${SECRET_JWTEXPIRATIONINMS}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookreview-net

volumes:
  postgres_data:

networks:
  bookreview-net:
    driver: bridge
